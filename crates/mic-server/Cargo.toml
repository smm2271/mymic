[package]
name = "mic-server"
version = "0.5.0"
edition = "2024"
[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rand.workspace = true
hex.workspace = true
axum = { version = "0.8", features = ["ws"] }
