[workspace]
resolver = "2"
members = [".", "crates/*"]
[package]
name = "rx"
version = "0.1.0"
edition = "2024"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
